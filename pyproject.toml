[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "imu-inference"
version = "1.0.1"
description = "Versioned CPU chest activity inference and experimental GP2 estimates"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "MODEL_LICENSES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4"]

[project.optional-dependencies]
runtime = [
  "scipy==1.18.1", "torch==2.14.1+cpu", "xgboost-cpu==3.4.1",
  "scikit-learn==1.9.1", "joblib==1.6.0", "threadpoolctl==3.7.0",
  "pandas==3.0.6", "mobgap==1.2.0", "PyWavelets==1.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/imu_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-plugin-autoload"
markers = ["model: loads real frozen models", "long: extended regression or endurance"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/imu_inference/_vendor", "src/imu_inference/notices"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
